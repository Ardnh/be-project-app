name: Build and Deploy Go App

on:
    push:
        branches: ["staging"]
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            # 1. Checkout source code
            - name: Checkout repository
              uses: actions/checkout@v4

            # 2. Setup Go
            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.21"

            # 3. Build Go binaries
            - name: Build Go binaries
              run: |
                  CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ./bin/main ./cmd/server/main.go
                  CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ./bin/migrate ./cmd/migrate/main.go

            # 4. Login to GHCR
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # 5. Generate metadata for Docker tags
            - name: Extract metadata (tags & labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch
                      type=sha
                      type=raw,value=latest,enable={{is_default_branch}}

            # 6. Build & push Docker image
            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

            # 7. Trigger VPS or Deployment Webhook
            # - name: Trigger Deploy Webhook
            #   if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
            #   run: |
            #       curl -X POST ${{ secrets.DEPLOY_WEBHOOK_URL }} \
            #         -H "Content-Type: application/json" \
            #         -H "X-Webhook-Token: ${{ secrets.WEBHOOK_SECRET }}" \
            #         -d '{
            #           "repository": "${{ github.repository }}",
            #           "branch": "${{ github.ref_name }}",
            #           "commit": "${{ github.sha }}",
            #           "image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            #         }'

            # 8. Final status log
            - name: Notify status
              if: always()
              run: |
                  if [ "${{ job.status }}" == "success" ]; then
                    echo "Deployment triggered successfully"
                  else
                    echo "Deployment failed"
                  fi
