name: Deploy to VPS (Simple)

on:
    push:
        branches:
            - staging

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            # 1. Checkout source code
            - name: Checkout code
              run: echo "Checkout code"

            # 2. Login ke Docker Hub
            - name: Login to Docker Hub
              run: echo "Login to Docker Hub"

            # 3. Build Docker image
            - name: Build Docker image
              run: echo "Building Docker image..."

            # 4. Push image ke Docker Hub
            - name: Push Docker image
              run:
                  echo "Pushing Docker image..."

                  # 5. Trigger Webhook VPS dengan HMAC Signature
            - name: Notify VPS (with X-Hub-Signature)
              env:
                  WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
                  WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
              run: |
                  # Payload sederhana
                  PAYLOAD='{"event": "deploy", "app": "myapp"}'

                  # Generate HMAC SHA256
                  SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')

                  # Kirim request ke VPS dengan header signature
                  curl -X POST "$WEBHOOK_URL" \
                    -H "Content-Type: application/json" \
                    -H "X-Hub-Signature: sha256=$SIGNATURE" \
                    -d "$PAYLOAD"
