name: Deploy to VPS (Simple)
on:
    push:
        branches:
            - staging
jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            # 1. Checkout source code
            - name: Checkout code
              uses: actions/checkout@v3
              with:
                  fetch-depth: 0

            # 2. Login ke GHCR
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            # 3. Set up Docker Buildx (untuk build yang lebih efisien)
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # 4. Build dan Push Docker image
            - name: Build and Push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/app-name:latest
                      ${{ secrets.DOCKERHUB_USERNAME }}/app-name:${{ github.sha }}
                  cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/app-name:latest
                  cache-to: type=inline

            # 5. Trigger Webhook VPS dengan HMAC Signature
            - name: Notify VPS (with X-Hub-Signature-256)
              env:
                  WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
                  WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
              run: |
                  # Escape commit message dengan benar
                  COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | jq -Rs . | sed 's/^"//;s/"$//')

                  # Buat payload dengan jq untuk ensure valid JSON
                  PAYLOAD=$(jq -n \
                    --arg repo "${{ github.repository }}" \
                    --arg branch "${{ github.ref_name }}" \
                    --arg commit "${{ github.sha }}" \
                    --arg commit_short "${GITHUB_SHA:0:7}" \
                    --arg commit_msg "$COMMIT_MSG" \
                    --arg image "Ardnh7/be-project-app:staging" \
                    --arg image_tag "staging-${{ github.sha }}" \
                    --arg digest "${{ steps.docker_build.outputs.digest }}" \
                    --arg deployer "${{ github.actor }}" \
                    --arg workflow_run_id "${{ github.run_id }}" \
                    --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                    '{
                      repository: $repo,
                      branch: $branch,
                      commit: $commit,
                      commit_short: $commit_short,
                      commit_message: $commit_msg,
                      image: $image,
                      image_tag: $image_tag,
                      digest: $digest,
                      deployer: $deployer,
                      workflow_run_id: $workflow_run_id,
                      timestamp: $timestamp
                    }')

                  # Debug: tampilkan payload (pretty)
                  echo "📦 Payload:"
                  echo "$PAYLOAD" | jq .

                  # Generate signature dari PAYLOAD yang akan dikirim
                  SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')

                  echo "🔐 Signature: sha256=$SIGNATURE"
                  echo "🔗 URL: $WEBHOOK_URL"

                  # Kirim request
                  HTTP_CODE=$(curl -X POST "$WEBHOOK_URL" \
                    -H "Content-Type: application/json" \
                    -H "X-Hub-Signature: sha256=$SIGNATURE" \
                    --data "$PAYLOAD" \
                    -w "%{http_code}" \
                    -s -o response.json)

                  echo "📨 Response (HTTP $HTTP_CODE):"
                  cat response.json | jq . 2>/dev/null || cat response.json
                  echo ""

                  if [ "$HTTP_CODE" = "200" ]; then
                    echo "✅ Deployment triggered successfully!"
                  else
                    echo "❌ Failed to trigger deployment. HTTP Code: $HTTP_CODE"
                    exit 1
                  fi
